openapi: 3.2.0
info:
  title: Ticket Tailor Utility API
  description: The Ticket Tailor API is a public REST API for the Ticket Tailor online event ticketing platform.
  version: '1.0'
  contact:
    name: Ticket Tailor
    url: https://developers.tickettailor.com/docs/intro/
servers:
- url: https://api.tickettailor.com/v1
  description: Ticket Tailor API v1
security:
- basicAuth: []
tags:
- name: Utility
  description: Connectivity and account overview.
paths:
  /ping:
    get:
      tags:
      - Utility
      summary: Ping
      description: Simple connectivity/authentication check.
      operationId: ping
      responses:
        '200':
          description: API reachable and credentials valid.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Auth. Supply your Ticket Tailor API key as the username and leave the password blank. Keys are managed in box office settings and are scoped to the issuing box office.
